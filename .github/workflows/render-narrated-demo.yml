name: Narrated editorial demo

on:
  push:
    branches:
      - video/editorial-narrated-v2
    paths:
      - scripts/render-narrated-demo.py
      - .github/workflows/render-narrated-demo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: "!contains(github.event.head_commit.message, '[skip video]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-video.txt
      - name: Install video and voice tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install -r requirements-video.txt
      - name: Render narrated 1080p MP4
        run: python scripts/render-narrated-demo.py
      - name: Commit finished video and verification manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/data-impact-graph-narrated.mp4 demo/narrated-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "demo: publish narrated 1080p editorial walkthrough [skip video]"
          git push origin HEAD:refs/heads/video/editorial-narrated-v2
